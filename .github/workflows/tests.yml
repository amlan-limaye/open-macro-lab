name: Test research package

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Existing and public-evidence tests
        run: python -m unittest discover -s tests -v
      - name: Build dependency-free wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install outside checkout and exercise offline CLI
        run: python scripts/check_install.py dist/open_macro_lab-0.3.0-py3-none-any.whl --public-report examples/official
      - name: Offline synthetic example and published report verification
        run: |
          python -m open_macro_lab demo --output build/ci-demo
          python -m open_macro_lab verify-report build/ci-demo
          python -m open_macro_lab verify-report examples/synthetic
          python -m open_macro_lab verify-report examples/official
          python scripts/check_public_example.py examples/official
          python scripts/check_report.py examples/official examples/synthetic
      - name: Range and accessible-overflow behavior
        if: runner.os == 'Linux'
        run: node scripts/check_interactions.js examples/official/index.html examples/synthetic/index.html
      - name: Check safe site staging and source inventory
        run: |
          python scripts/stage_site.py --output build/site
          python scripts/package_release.py
